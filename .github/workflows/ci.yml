name: MAU V2 Foundation CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro check
        run: npm run check

      - name: Staging build
        run: npm run build

      - name: Verify build artifacts
        run: npm run verify:build

      - name: Static staging QA
        run: npm run qa:static

      - name: Upload staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: mau-v2-staging-${{ github.event.pull_request.number || github.run_number }}
          path: |
            dist/
            package-lock.json
          if-no-files-found: error
          retention-days: 7
